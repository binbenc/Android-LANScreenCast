name: Release

# Push a tag like v1.0.0 to build release APKs and publish a GitHub Release.
# Optional signing secrets (APKs are published unsigned when they are missing):
#   SIGNING_KEYSTORE_BASE64  base64 of the .jks/.keystore file
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password (defaults to the store password)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Test and assemble release
        run: ./gradlew test assembleRelease --stacktrace

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            if [ -n "${KEY_PASSWORD:-}" ]; then KEY_PASS_VAR=KEY_PASSWORD; else KEY_PASS_VAR=STORE_PASSWORD; fi
            for apk in app/build/outputs/apk/release/*-release-unsigned.apk; do
              abi="$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')"
              out="dist/LANScreenCast-${VERSION}-${abi}.apk"
              "$APKSIGNER" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/release.keystore" \
                --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
                --key-pass "env:${KEY_PASS_VAR}" \
                --out "$out" "$apk"
              "$APKSIGNER" verify "$out"
            done
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No signing secrets configured; publishing unsigned APKs."
            for apk in app/build/outputs/apk/release/*-release-unsigned.apk; do
              abi="$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')"
              cp "$apk" "dist/LANScreenCast-${VERSION}-${abi}-unsigned.apk"
            done
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/
          retention-days: 14
