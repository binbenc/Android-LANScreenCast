name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  check:
    name: Unit tests, lint, debug build (without Apple-compatible module)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4   # also validates the Gradle wrapper

      - name: Test, lint and assemble
        run: ./gradlew -Pwsc.airplay=false test lint assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-check
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  full-build:
    name: Full debug build (with Apple-compatible module)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Native deps cache key
        id: native-key
        run: echo "key=native-deps-${NDK_VERSION}-$(git submodule status | sha256sum | cut -c1-16)-${{ hashFiles('protocol-impl/airplay/scripts/build-native-deps.sh') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: protocol-impl/airplay/native-deps
          key: ${{ steps.native-key.outputs.key }}

      - name: Assemble debug and run unit tests
        run: ./gradlew assembleDebug test --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 14
