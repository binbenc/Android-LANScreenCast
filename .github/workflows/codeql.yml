name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'   # weekly, Monday 03:23 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Kotlin needs a real compilation; skip the native Apple-compatible module and disable caches so every source is compiled.
      - name: Build
        run: ./gradlew -Pwsc.airplay=false assembleDebug --no-build-cache --no-configuration-cache --stacktrace

      # Free memory for the analysis (the Gradle and Kotlin daemons otherwise keep several GB; the runner was killed mid-analysis).
      - name: Stop build daemons
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
