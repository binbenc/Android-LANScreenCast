# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# When configured, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration has changed.
org.gradle.configuration-cache=true
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AirPlay 兼容构建开关（技术方案 3.8）。
# 默认包含（PRD 决策 #3：内置、设置里默认关闭）。需要先拉取 protocol-impl/airplay/src/main/cpp/third_party 下的子模块；
# 不带 AirPlay 构建：./gradlew assembleDebug -Pwsc.airplay=false
wsc.airplay=true
